[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-recovery-bench"
version = "0.1.0"
description = "Reproducible failure injection and recovery evaluation for VLA policies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VLA Recovery Bench contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "numpy>=1.26,<3.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0",
]
robocasa = [
  "numpy>=1.26,<3.0",
  "Pillow>=10.0,<13.0",
  "h5py>=3.10,<4.0",
]

[project.scripts]
vla-recovery-bench = "vla_recovery_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
